name: Continuous integration

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pdo_mysql
          coverage: none
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: locked
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: sail
          DB_PASSWORD: password
      - run: composer ci
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: sail
          DB_PASSWORD: password

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.12.0
      - name: Show frontend toolchain
        run: |
          node --version
          npm --version
      - run: npm ci
      - run: npm run check:api
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build:pwa
      - run: npm audit --omit=dev

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          load: true
          tags: conference-mc-app:test
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Smoke test production application image
        run: |
          docker run --rm --user www-data conference-mc-app:test sh -lc 'test -d storage/framework/cache/data && test -d storage/framework/sessions && test -d storage/framework/views && test -d storage/logs && test -d bootstrap/cache && test -w storage/framework/cache/data && test -w storage/framework/sessions && test -w storage/framework/views && test -w storage/logs && test -w bootstrap/cache && test -f public/index.html && test -f public/sw.js && test -f public/manifest.json'
          docker run --rm --user www-data -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= -e CACHE_STORE=array -e SESSION_DRIVER=array -e QUEUE_CONNECTION=sync conference-mc-app:test php artisan --version
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          load: true
          tags: conference-mc-web:test
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Validate nginx proxy forwarding
        run: |
          docker run --rm --add-host app:127.0.0.1 --entrypoint sh conference-mc-web:test -lc 'nginx -t && test -f /var/www/html/public/index.html && test -f /var/www/html/public/sw.js && grep -Fq "fastcgi_param HTTP_X_FORWARDED_FOR \$http_x_forwarded_for;" /etc/nginx/conf.d/default.conf && grep -Fq "fastcgi_param HTTP_X_FORWARDED_HOST \$http_x_forwarded_host;" /etc/nginx/conf.d/default.conf && grep -Fq "fastcgi_param HTTP_X_FORWARDED_PORT \$http_x_forwarded_port;" /etc/nginx/conf.d/default.conf && grep -Fq "fastcgi_param HTTP_X_FORWARDED_PROTO \$http_x_forwarded_proto;" /etc/nginx/conf.d/default.conf && grep -Fq "try_files \$uri \$uri/ /index.html;" /etc/nginx/conf.d/default.conf'
